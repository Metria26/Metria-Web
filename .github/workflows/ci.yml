name: CI

on:
  pull_request:
  push:
    branches: [main]

# Placeholder env for clean-clone build/dev (no secrets). Real values live in
# .env.local (gitignored); see .env.example for the contract.
env:
  NEXT_PUBLIC_PRODUCT_NAME: Metria
  NEXT_PUBLIC_SITE_URL: http://localhost:3000
  NEXT_PUBLIC_SUPABASE_URL: http://127.0.0.1:54321
  NEXT_PUBLIC_SUPABASE_ANON_KEY: ci-placeholder-anon-key
  SUPABASE_SERVICE_ROLE_KEY: ci-placeholder-service-role-key
  SUPABASE_DB_URL: postgres://postgres:postgres@127.0.0.1:54322/postgres
  BOOTSTRAP_ADMIN_EMAIL: admin@example.com
  GOOGLE_OAUTH_CLIENT_ID: ci-placeholder-client-id
  GOOGLE_OAUTH_CLIENT_SECRET: ci-placeholder-client-secret

jobs:
  ci:
    # ubuntu-latest migrated to Ubuntu 26 on 2026-10-19 (runner-images#14748);
    # `supabase start` is broken on the new image. Stay on the 24.04 image
    # until Supabase local is verified on 26.04.
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm

      - name: Install
        run: pnpm install --frozen-lockfile

      - name: Lint
        run: pnpm lint

      - name: Typecheck
        run: pnpm typecheck

      - name: Unit tests
        run: pnpm test

      - name: Build
        run: pnpm build

      - name: Migration filename lint
        run: |
          shopt -s nullglob
          for f in supabase/migrations/*.sql; do
            base=$(basename "$f")
            if ! echo "$base" | grep -Eq '^[0-9]{14}_[sab]_[a-z0-9_]+\.sql$'; then
              echo "Invalid migration filename: $base (expected <UTCts>_{s|a|b}_<module>_<slug>.sql)"
              exit 1
            fi
          done
          echo "Migration filenames OK"

      - name: Secret guard
        run: |
          # Tracked secret files must never exist — only .env.example is allowed.
          # (The previous repo was flagged for a committed secrets manifest;
          # 2026-10-18 migration. History was rewritten, but never rely on that.)
          if git ls-files | grep -Ei '(^|/)(\.env($|\.)|metria_?env)' | grep -v '^\.env\.example$'; then
            echo "Sensitive env file is tracked"
            exit 1
          fi
          # Whole-tree scan for high-confidence credential shapes. The local
          # Supabase demo keys (issuer "supabase-demo") intentionally do not
          # match the JWT pattern; real project JWTs carry "ref" in the payload.
          if git grep -nEi 'GOCSPX[-]|(^|[^A-Za-z0-9_])re_[A-Za-z0-9]{24,}|AIza[0-9A-Za-z_-]{30,}|eyJ[A-Za-z0-9_-]*\.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6' -- . ':(exclude).env.example' ':(exclude)pnpm-lock.yaml'; then
            echo "Potential secret committed"
            exit 1
          fi
          echo "No leaked secrets found"

      - name: Setup Supabase CLI
        uses: supabase/setup-cli@v1
        with:
          # Pinned: "latest" drift broke `supabase start` after run 16
          # (v2.115.0 is the version the last green CI ran and what local
          # dev uses). Bump deliberately, together with supabase CLI updates.
          version: v2.115.0

      - name: Raise nofile limits for Supabase containers
        run: |
          # Docker 29 on the October 2026 runner-image release re-broke the
          # container RLIMIT_NOFILE dance (supabase/cli#4443 class of
          # failures: a core container cannot raise its open-files limit and
          # dies unhealthy). Raise host + daemon defaults above Supabase's
          # 100000 before starting the stack.
          sudo bash -c 'ulimit -n 200000'
          node -e "const fs=require('fs');const p='/etc/docker/daemon.json';let j={};try{j=JSON.parse(fs.readFileSync(p,'utf8'))}catch(e){};j['default-ulimits']={nofile:{Name:'nofile',Hard:200000,Soft:200000}};fs.writeFileSync('/tmp/daemon.json',JSON.stringify(j))"
          sudo mv /tmp/daemon.json /etc/docker/daemon.json
          sudo systemctl restart docker
          timeout 30 sh -c 'until docker info > /dev/null 2>&1; do sleep 1; done'

      - name: Start local stack
        run: |
          set -o pipefail
          supabase start 2>&1 | tee supabase-start-out.txt

      - name: Dump stack failure diagnostics
        if: failure()
        run: |
          {
            echo "=== supabase start output ==="
            cat supabase-start-out.txt 2>/dev/null || true
            echo ""
            echo "=== docker containers ==="
            sudo docker ps -a 2>&1 || true
            echo ""
            echo "=== container logs (last 40 lines each) ==="
            for c in $(sudo docker ps -aq 2>/dev/null | head -20); do
              echo "===== container $c ====="
              sudo docker logs --tail 40 "$c" 2>&1 || true
            done
          } > supabase-start-failure.txt
          # Job summaries are public: this puts the real error on the run page.
          cat supabase-start-failure.txt >> "$GITHUB_STEP_SUMMARY"

      - name: Upload stack failure diagnostics
        if: failure() && hashFiles('supabase-start-failure.txt') != ''
        uses: actions/upload-artifact@v4
        with:
          name: supabase-start-diagnostics
          path: supabase-start-failure.txt
          if-no-files-found: ignore

      - name: Apply migrations (clean)
        run: supabase db reset

      - name: pgTAP tests
        run: |
          if ls supabase/migrations/*.sql 1>/dev/null 2>&1; then
            supabase test db
          else
            echo "No migrations yet - pgTAP starts with the Foundation Gate (F2)"
          fi

  e2e:
    if: github.ref == 'refs/heads/main' || github.event_name == 'pull_request'
    runs-on: ubuntu-24.04
    needs: ci
    # Real local-stack values (default demo keys are public, not secrets) so
    # auth-gated shell tests can create a fixture user via the admin API.
    env:
      NEXT_PUBLIC_PRODUCT_NAME: Metria
      NEXT_PUBLIC_SITE_URL: http://localhost:3000
      NEXT_PUBLIC_SUPABASE_URL: http://127.0.0.1:54321
      NEXT_PUBLIC_SUPABASE_ANON_KEY: eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZS1kZW1vIiwicm9sZSI6ImFub24iLCJleHAiOjE5ODM4MTI5OTZ9.CRXP1A7WOeoJeXxjNni43kdQwgnWNReilDMblYTn_I0
      SUPABASE_SERVICE_ROLE_KEY: eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZS1kZW1vIiwicm9sZSI6InNlcnZpY2Vfcm9sZSIsImV4cCI6MTk4MzgxMjk5Nn0.EGIM96RAZx35lJzdJsyH-qQwv8Hdp7fsn3W0YpN81IU
      SUPABASE_DB_URL: postgres://postgres:postgres@127.0.0.1:54322/postgres
      BOOTSTRAP_ADMIN_EMAIL: admin@example.com
      GOOGLE_OAUTH_CLIENT_ID: ci-placeholder-client-id
      GOOGLE_OAUTH_CLIENT_SECRET: ci-placeholder-client-secret
    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm

      - name: Install
        run: pnpm install --frozen-lockfile

      - name: Install Playwright browsers
        run: pnpm exec playwright install --with-deps chromium

      - name: Setup Supabase CLI
        uses: supabase/setup-cli@v1
        with:
          version: v2.115.0

      - name: Raise nofile limits for Supabase containers
        run: |
          # See the ci job step: Docker 29 container RLIMIT_NOFILE breakage.
          sudo bash -c 'ulimit -n 200000'
          node -e "const fs=require('fs');const p='/etc/docker/daemon.json';let j={};try{j=JSON.parse(fs.readFileSync(p,'utf8'))}catch(e){};j['default-ulimits']={nofile:{Name:'nofile',Hard:200000,Soft:200000}};fs.writeFileSync('/tmp/daemon.json',JSON.stringify(j))"
          sudo mv /tmp/daemon.json /etc/docker/daemon.json
          sudo systemctl restart docker
          timeout 30 sh -c 'until docker info > /dev/null 2>&1; do sleep 1; done'

      - name: Start local stack
        run: |
          set -o pipefail
          supabase start 2>&1 | tee supabase-start-out.txt

      - name: Dump stack failure diagnostics
        if: failure()
        run: |
          {
            echo "=== supabase start output ==="
            cat supabase-start-out.txt 2>/dev/null || true
            echo ""
            echo "=== docker containers ==="
            sudo docker ps -a 2>&1 || true
            echo ""
            echo "=== container logs (last 40 lines each) ==="
            for c in $(sudo docker ps -aq 2>/dev/null | head -20); do
              echo "===== container $c ====="
              sudo docker logs --tail 40 "$c" 2>&1 || true
            done
          } > supabase-start-failure.txt
          cat supabase-start-failure.txt >> "$GITHUB_STEP_SUMMARY"

      - name: Upload stack failure diagnostics
        if: failure() && hashFiles('supabase-start-failure.txt') != ''
        uses: actions/upload-artifact@v4
        with:
          name: supabase-start-diagnostics
          path: supabase-start-failure.txt
          if-no-files-found: ignore

      - name: Apply migrations (clean)
        run: supabase db reset

      - name: Build
        run: pnpm build

      - name: Playwright (all suites except ads-safety)
        run: pnpm exec playwright test --grep-invert "ads-safety"

      # ads.safety (T-B003) flips the global ads.* flags and seeds a sponsor
      # fixture: page_types keys are globally unique, so no tenant-scoped
      # variant exists. Run it alone, single-worker, after the main pass so no
      # other suite observes the flipped state (and it sees a clean server).
      - name: Playwright (ads-safety, isolated)
        run: pnpm exec playwright test --grep "ads-safety" --workers=1
