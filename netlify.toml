# DEP-1 (ADR-009, amended 2026-10-18): Netlify Free deployment of Metria-Web.
#
# Cautions before changing (full context: README "Hosting — Netlify (DEP-1)"):
# - Production deploys cost 15 of the 300 monthly credits (failed deploys and
#   rollbacks are free) — batch merges to `main`.
# - Staging runs on free branch deploys enabled in the Netlify UI
#   (Site configuration -> Build & deploy -> Deploy contexts).
# - A path-scoped [build] ignore rule (skip docs-only pushes) is planned AFTER
#   first-deploy stability is confirmed; do not add one before that.
# - Netlify's Next.js runtime auto-installs (detects the `next` dependency);
#   the Next.js 16 cacheComponents support relies on it staying current.

[build]
  command = "pnpm build"

[build.environment]
  NODE_VERSION = "22"
  # Netlify secrets scanning: the omit list for the public/seeded keys
  # (NEXT_PUBLIC_*, BOOTSTRAP_ADMIN_EMAIL — not secrets; real secrets stay
  # scanned) is set in the Netlify UI ONLY (Site configuration → Environment
  # variables; scope "Builds", all contexts). Do NOT inline that variable's
  # comma-joined value here: the scanner scans env-var values, so a copy of
  # itself in this file fails every build (DEP-1 trap ③, 2026-10-19; full
  # story in README "Hosting — Netlify").
